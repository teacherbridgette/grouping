<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Workshop Experience</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.85); color: white; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 99999; font-family: sans-serif; text-align: center;
      }
      button {
        padding: 16px 32px; font-size: 18px; font-weight: bold;
        background-color: #28a745; color: white; border: none; border-radius: 8px;
        margin-top: 15px; cursor: pointer;
      }
    </style>

    <script>
      // Component to manage video state on target tracking
      AFRAME.registerComponent('smart-video', {
        schema: {
          src: {type: 'string'}
        },
        init: function () {
          var el = this.el;
          var videoUrl = this.data.src;

          // Pre-create the element to bind to A-Frame
          this.videoEl = document.createElement('video');
          this.videoEl.setAttribute('src', videoUrl);
          this.videoEl.setAttribute('crossOrigin', 'anonymous');
          this.videoEl.setAttribute('playsinline', '');
          this.videoEl.setAttribute('webkit-playsinline', '');
          this.videoEl.preload = 'auto';
          this.videoEl.loop = true;

          var aVideo = el.querySelector('a-video');
          aVideo.setAttribute('src', this.videoEl);

          el.addEventListener('targetFound', function () {
            if (this.videoEl) {
              this.videoEl.currentTime = 0;
              var promise = this.videoEl.play();
              if (promise !== undefined) {
                promise.catch(function(error) {
                  console.log("Playback prevented: ", error);
                });
              }
            }
          }.bind(this));

          el.addEventListener('targetLost', function () {
            if (this.videoEl) {
              this.videoEl.pause();
            }
          }.bind(this));
        }
      });

      function startAR() {
        // Unlock video/audio playback engine on mobile browsers
        var entities = document.querySelectorAll('[smart-video]');
        entities.forEach(function(entity) {
          var component = entity.components['smart-video'];
          if (component && component.videoEl) {
            // Momentarily play and pause to grant browser media permission
            component.videoEl.play().then(function() {
              component.videoEl.pause();
            }).catch(function(e) {
              console.log("Unlock notice:", e);
            });
          }
        });

        // Hide overlay screen
        document.getElementById('overlay').style.display = 'none';
      }
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">

    <div id="overlay">
      <h2>AR Classroom Scanner</h2>
      <p>Tap start to enable camera and audio</p>
      <button onclick="startAR()">Start Camera</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0 -> Load video1.mp4 -->
      <a-entity mindar-image-target="targetIndex: 0" smart-video="src: video1.mp4">
        <a-video width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

      <!-- Target 1 -> Load video2.mp4 -->
      <a-entity mindar-image-target="targetIndex: 1" smart-video="src: video2.mp4">
        <a-video width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

      <!-- Target 2 -> Load video3.mp4 -->
      <a-entity mindar-image-target="targetIndex: 2" smart-video="src: video3.mp4">
        <a-video width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

      <!-- Target 3 -> Load video4.mp4 -->
      <a-entity mindar-image-target="targetIndex: 3" smart-video="src: video4.mp4">
        <a-video width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

    </a-scene>
  </body>
</html>
