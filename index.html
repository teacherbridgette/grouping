<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Workshop Experience</title>

    <!-- Stable A-Frame & MindAR CDNs -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.85); color: white; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 99999; font-family: sans-serif; text-align: center;
      }
      button {
        padding: 16px 32px; font-size: 18px; font-weight: bold;
        background-color: #28a745; color: white; border: none; border-radius: 8px;
        margin-top: 15px; cursor: pointer;
      }
    </style>

    <script>
      AFRAME.registerComponent('ar-video-target', {
        schema: {
          src: {type: 'string'},
          targetIndex: {type: 'int'}
        },
        init: function () {
          var el = this.el;
          var videoUrl = this.data.src;

          // Create video element directly in memory
          this.videoEl = document.createElement('video');
          this.videoEl.src = videoUrl;
          this.videoEl.crossOrigin = 'anonymous';
          this.videoEl.playsInline = true;
          this.videoEl['webkit-playsinline'] = true;
          this.videoEl.loop = true;
          this.videoEl.preload = 'metadata';

          // Create standard A-Frame video plane
          var aVideo = document.createElement('a-video');
          aVideo.setAttribute('width', '1');
          aVideo.setAttribute('height', '0.5625');
          aVideo.setAttribute('position', '0 0 0');
          el.appendChild(aVideo);

          // Connect video element texture on tracking event
          el.addEventListener('targetFound', function () {
            if (this.videoEl) {
              aVideo.setAttribute('src', this.videoEl);
              this.videoEl.currentTime = 0;
              this.videoEl.muted = false;
              
              var playPromise = this.videoEl.play();
              if (playPromise !== undefined) {
                playPromise.catch(function(e) {
                  console.log("Playback error:", e);
                });
              }
            }
          }.bind(this));

          el.addEventListener('targetLost', function () {
            if (this.videoEl) {
              this.videoEl.pause();
            }
          }.bind(this));
        }
      });

      function startAR() {
        // Unlock browser audio context on touch
        var targets = document.querySelectorAll('[ar-video-target]');
        targets.forEach(function(targetEl) {
          var comp = targetEl.components['ar-video-target'];
          if (comp && comp.videoEl) {
            comp.videoEl.play().then(function() {
              comp.videoEl.pause();
            }).catch(function(e){ console.log("Unlock info:", e); });
          }
        });

        // Hide overlay screen to show camera feed
        document.getElementById('overlay').style.display = 'none';
      }
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">

    <div id="overlay">
      <h2>Classroom AR Scanner</h2>
      <p>Tap start to enable camera and sound</p>
      <button onclick="startAR()">Start Camera</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0 -> video1.mp4 -->
      <a-entity mindar-image-target="targetIndex: 0" ar-video-target="src: video1.mp4; targetIndex: 0"></a-entity>

      <!-- Target 1 -> video2.mp4 -->
      <a-entity mindar-image-target="targetIndex: 1" ar-video-target="src: video2.mp4; targetIndex: 1"></a-entity>

      <!-- Target 2 -> video3.mp4 -->
      <a-entity mindar-image-target="targetIndex: 2" ar-video-target="src: video3.mp4; targetIndex: 2"></a-entity>

      <!-- Target 3 -> video4.mp4 -->
      <a-entity mindar-image-target="targetIndex: 3" ar-video-target="src: video4.mp4; targetIndex: 3"></a-entity>

    </a-scene>
  </body>
</html>
