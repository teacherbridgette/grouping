<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Workshop Experience</title>

    <!-- Stable A-Frame & MindAR CDNs -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.85); color: white; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 99999; font-family: sans-serif; text-align: center;
      }
      button {
        padding: 16px 32px; font-size: 18px; font-weight: bold;
        background-color: #28a745; color: white; border: none; border-radius: 8px;
        margin-top: 15px; cursor: pointer;
      }
      /* Keep videos in DOM for browser trust, but hide visually */
      .hidden-media {
        display: none;
      }
    </style>

    <script>
      AFRAME.registerComponent('ar-video-target', {
        schema: {
          video: {type: 'string'}
        },
        init: function () {
          var el = this.el;
          var videoSelector = this.data.video;
          this.vid = document.querySelector(videoSelector);

          var aVideo = document.createElement('a-video');
          aVideo.setAttribute('width', '1');
          aVideo.setAttribute('height', '0.5625');
          aVideo.setAttribute('position', '0 0 0');
          if (this.vid) {
            aVideo.setAttribute('src', videoSelector);
          }
          el.appendChild(aVideo);

          el.addEventListener('targetFound', function () {
            if (this.vid) {
              this.vid.currentTime = 0;
              this.vid.muted = false;
              var playPromise = this.vid.play();
              if (playPromise !== undefined) {
                playPromise.catch(function(e) {
                  console.log("Playback error:", e);
                });
              }
            }
          }.bind(this));

          el.addEventListener('targetLost', function () {
            if (this.vid) {
              this.vid.pause();
            }
          }.bind(this));
        }
      });

      function startAR() {
        // Unlock browser audio/video engine on touch for all HTML5 videos
        var videos = document.querySelectorAll('video');
        videos.forEach(function(vid) {
          vid.play().then(function() {
            vid.pause();
          }).catch(function(e){ console.log("Unlock info:", e); });
        });

        // Hide overlay screen to show camera feed
        document.getElementById('overlay').style.display = 'none';
      }
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">

    <div id="overlay">
      <h2>Classroom AR Scanner</h2>
      <p>Tap start to enable camera and sound</p>
      <button onclick="startAR()">Start Camera</button>
    </div>

    <!-- HTML5 Videos attached in DOM to bypass mobile autoplay blocks -->
    <div class="hidden-media">
      <video id="v1" src="video1.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      <video id="v2" src="video2.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      <video id="v3" src="video3.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      <video id="v4" src="video4.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Targets linked to HTML5 video elements -->
      <a-entity mindar-image-target="targetIndex: 0" ar-video-target="video: #v1"></a-entity>
      <a-entity mindar-image-target="targetIndex: 1" ar-video-target="video: #v2"></a-entity>
      <a-entity mindar-image-target="targetIndex: 2" ar-video-target="video: #v3"></a-entity>
      <a-entity mindar-image-target="targetIndex: 3" ar-video-target="video: #v4"></a-entity>

    </a-scene>
  </body>
</html>
