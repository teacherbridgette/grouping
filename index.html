<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Workshop Experience</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.85); color: white; display: flex;
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 99999; font-family: sans-serif; text-align: center;
      }
      button {
        padding: 16px 32px; font-size: 18px; font-weight: bold;
        background-color: #28a745; color: white; border: none; border-radius: 8px;
        margin-top: 15px; cursor: pointer;
      }
    </style>

    <script>
      AFRAME.registerComponent('ar-video', {
        init: function () {
          var target = this.el;
          var videoSelector = target.getAttribute('data-video');
          this.vid = document.querySelector(videoSelector);

          target.addEventListener('targetFound', function () {
            if (this.vid) {
              this.vid.currentTime = 0;
              this.vid.muted = false; // Enable audio once scanned
              var playPromise = this.vid.play();
              if (playPromise !== undefined) {
                playPromise.catch(function(e) { console.log("Play error:", e); });
              }
            }
          }.bind(this));

          target.addEventListener('targetLost', function () {
            if (this.vid) {
              this.vid.pause();
            }
          }.bind(this));
        }
      });

      function startAR() {
        document.getElementById('overlay').style.display = 'none';

        // Unlock mobile audio/video engine on initial click
        var videos = document.querySelectorAll('video');
        videos.forEach(function(vid) {
          vid.play().then(function() {
            vid.pause();
          }).catch(function(e) { console.log("Unlock error:", e); });
        });
      }
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">

    <div id="overlay">
      <h2>Classroom AR Scanner</h2>
      <p>Tap start to enable camera and audio</p>
      <button onclick="startAR()">Start Camera</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Videos preloaded muted so mobile security lets A-Frame build target planes -->
        <video id="v1" src="video1.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        <video id="v2" src="video2.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        <video id="v3" src="video3.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
        <video id="v4" src="video4.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0 -->
      <a-entity mindar-image-target="targetIndex: 0" ar-video data-video="#v1">
        <a-video src="#v1" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

      <!-- Target 1 -->
      <a-entity mindar-image-target="targetIndex: 1" ar-video data-video="#v2">
        <a-video src="#v2" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

      <!-- Target 2 -->
      <a-entity mindar-image-target="targetIndex: 2" ar-video data-video="#v3">
        <a-video src="#v3" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

      <!-- Target 3 -->
      <a-entity mindar-image-target="targetIndex: 3" ar-video data-video="#v4">
        <a-video src="#v4" width="1" height="0.5625" position="0 0 0"></a-video>
      </a-entity>

    </a-scene>
  </body>
</html>
